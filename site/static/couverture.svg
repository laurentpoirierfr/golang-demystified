<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-labelledby="titre">
  <title id="titre">Couverture : Golang Demystified, le langage Go, ses outils et son évolution</title>
  <style>
    .serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Source Serif 4",serif}
    .sans{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Source Sans 3",sans-serif}
    .mono{font-family:ui-monospace,"SFMono-Regular","JetBrains Mono",Menlo,Consolas,"Go Mono",monospace}
    .tr{fill:none;stroke:#5fd0e8;stroke-width:2}
    .bx{fill:#123a4d;stroke:#5fd0e8;stroke-width:2}
    .bx2{fill:#0b2533;stroke:#5fd0e8;stroke-width:2}
    .ch{fill:#0b2533;stroke:#00add8;stroke-width:2}
    .val{fill:#00add8}
    .lbl{fill:#cfe9f1}
  </style>
  <defs>
    <pattern id="points" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.1" fill="#5fd0e8" opacity="0.22"/>
    </pattern>
    <marker id="fleche" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#5fd0e8" stroke-width="1.6"/>
    </marker>
  </defs>

  <!-- Fond et cadre -->
  <rect width="600" height="900" fill="#0b2533"/>
  <rect x="28" y="28" width="544" height="844" fill="none" stroke="#1f4a5c" stroke-width="1.5"/>
  <rect x="36" y="36" width="528" height="828" fill="none" stroke="#1f4a5c" stroke-width="0.75"/>

  <!-- Titre -->
  <text x="300" y="112" text-anchor="middle" class="sans" font-size="15" letter-spacing="5" fill="#5fd0e8">LE LANGAGE GO EXPLIQUÉ</text>
  <text x="300" y="226" text-anchor="middle" class="serif" font-size="88" fill="#f8fafc">Golang</text>
  <text x="300" y="314" text-anchor="middle" class="serif" font-size="80" fill="#f8fafc">Demystified</text>
  <line x1="240" y1="350" x2="360" y2="350" stroke="#00add8" stroke-width="1.5"/>
  <text x="300" y="392" text-anchor="middle" class="serif" font-size="22" font-style="italic" fill="#cbd5e1">Le langage, ses outils et son évolution</text>
  <text x="300" y="428" text-anchor="middle" class="sans" font-size="12" letter-spacing="3" fill="#8fb3c2">ÉDITION GO 1.27</text>

  <!-- Illustration : une goroutine distribue le travail sur un channel,
       trois goroutines le traitent, un second channel rassemble les résultats -->
  <rect x="60" y="452" width="480" height="364" fill="url(#points)"/>

  <!-- main -->
  <rect x="240" y="470" width="120" height="56" rx="3" class="bx"/>
  <line x1="240" y1="490" x2="360" y2="490" class="tr" stroke-width="1"/>
  <text x="300" y="514" text-anchor="middle" class="mono lbl" font-size="13">main()</text>

  <!-- channel de distribution -->
  <line x1="300" y1="526" x2="300" y2="546" class="tr"/>
  <rect x="262" y="546" width="76" height="24" rx="12" class="ch"/>
  <circle cx="284" cy="558" r="4" class="val"/>
  <circle cx="300" cy="558" r="4" class="val"/>
  <circle cx="316" cy="558" r="4" class="val" opacity="0.5"/>

  <!-- fan-out -->
  <line x1="276" y1="570" x2="172" y2="617" class="tr" marker-end="url(#fleche)"/>
  <line x1="300" y1="570" x2="300" y2="617" class="tr" marker-end="url(#fleche)"/>
  <line x1="324" y1="570" x2="428" y2="617" class="tr" marker-end="url(#fleche)"/>
  <circle cx="225" cy="593" r="3.5" class="val"/>
  <circle cx="375" cy="593" r="3.5" class="val"/>

  <!-- workers -->
  <rect x="100" y="620" width="120" height="56" rx="3" class="bx"/>
  <line x1="100" y1="640" x2="220" y2="640" class="tr" stroke-width="1"/>
  <text x="160" y="664" text-anchor="middle" class="mono lbl" font-size="12">go work()</text>
  <rect x="240" y="620" width="120" height="56" rx="3" class="bx"/>
  <line x1="240" y1="640" x2="360" y2="640" class="tr" stroke-width="1"/>
  <text x="300" y="664" text-anchor="middle" class="mono lbl" font-size="12">go work()</text>
  <rect x="380" y="620" width="120" height="56" rx="3" class="bx"/>
  <line x1="380" y1="640" x2="500" y2="640" class="tr" stroke-width="1"/>
  <text x="440" y="664" text-anchor="middle" class="mono lbl" font-size="12">go work()</text>

  <!-- fan-in -->
  <line x1="172" y1="676" x2="266" y2="721" class="tr" marker-end="url(#fleche)"/>
  <line x1="300" y1="676" x2="300" y2="715" class="tr" marker-end="url(#fleche)"/>
  <line x1="428" y1="676" x2="334" y2="721" class="tr" marker-end="url(#fleche)"/>
  <circle cx="219" cy="698.5" r="3.5" class="val"/>
  <circle cx="381" cy="698.5" r="3.5" class="val"/>
  <rect x="262" y="718" width="76" height="24" rx="12" class="ch"/>
  <circle cx="292" cy="730" r="4" class="val"/>
  <circle cx="308" cy="730" r="4" class="val" opacity="0.5"/>

  <!-- résultat -->
  <line x1="300" y1="742" x2="300" y2="765" class="tr" stroke-dasharray="4 4" marker-end="url(#fleche)"/>
  <rect x="240" y="768" width="120" height="40" rx="3" class="bx2"/>
  <text x="300" y="793" text-anchor="middle" class="mono lbl" font-size="12">range out</text>

  <!-- Pied -->
  <text x="300" y="844" text-anchor="middle" class="sans" font-size="12" letter-spacing="3.5" fill="#5f8696">LANGAGE · OUTILS · BIBLIOTHÈQUE · VERSIONS</text>
</svg>
