<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Polices du conteneur d'impression (FONTCONFIG_FILE, voir construit.sh).
     Les schémas SVG chargés par <img> n'ont pas accès aux @font-face de la
     page : ils demandent des familles génériques (system-ui, sans-serif,
     ui-monospace…), que l'on fait pointer ici vers les polices du livre.
     Les alias précèdent la configuration du système pour passer devant. -->
<fontconfig>
  <dir>/usr/src/app/livre/polices</dir>
  <alias binding="strong"><family>system-ui</family><prefer><family>Source Sans 3</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Source Sans 3</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>Source Serif 4</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>ui-monospace</family><prefer><family>Go Mono</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>Go Mono</family><family>DejaVu Sans</family></prefer></alias>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
</fontconfig>
