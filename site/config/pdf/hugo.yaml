# Environnement « pdf » (hugo --environment pdf), utilisé par pdf/construit.sh :
# il ajoute à la page d'accueil le format « livre », tout le livre sur une
# seule page (layouts/home.livre.html), que pdf/imprime.js pagine et imprime.
# Le site publié ne contient pas cette page.
outputFormats:
  livre:
    mediaType: text/html
    baseName: index
    path: livre
    isHTML: true
    notAlternative: true
    permalinkable: false

outputs:
  home: [html, livre]

params:
  # Adresse du site publié, rappelée sous la table des matières du PDF.
  enLigne: laurentpoirierfr.github.io/golang-demystified
