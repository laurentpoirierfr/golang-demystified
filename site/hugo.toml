baseURL = "https://laurentpoirierfr.github.io/golang-demystified/"
locale = "fr-FR"
defaultContentLanguage = "fr"
title = "Golang Demystified"
enableRobotsTXT = true
enableGitInfo = true

# Thème hugo-book, avec la mise en page de livre de assets/styles/custom.css
# (même style que le projet basic-knowledge).
[module]
  [[module.imports]]
    path = "github.com/alex-shpak/hugo-book"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.parser.attribute]
    block = true
    title = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.highlight]
    noClasses = false   # couleurs par classes CSS, voir assets/styles/custom.css

# Les parties du livre se replient dans le menu ; celle de la page ouverte
# reste dépliée.
[[cascade]]
  [cascade.params]
    bookCollapseSection = true
  [cascade.target]
    kind = "section"
    path = "/docs/**"

# Liens sous le menu
[[menu.after]]
  name = "Livre en PDF"
  url = "https://github.com/laurentpoirierfr/golang-demystified/releases/latest/download/golang-demystified.pdf"
  weight = 10
[[menu.after]]
  name = "Diapositives"
  url = "https://laurentpoirierfr.github.io/golang-demystified/diapositives/"
  weight = 20
[[menu.after]]
  name = "Dépôt GitHub"
  url = "https://github.com/laurentpoirierfr/golang-demystified"
  weight = 30

[params]
  description = "Go dans son ensemble : le langage, ses outils et son évolution au fil des versions."
  BookTheme = "auto"
  BookSection = "docs"
  BookToC = true
  BookBreadcrumbs = true
  BookSearch = true
  BookComments = false
  BookRepo = "https://github.com/laurentpoirierfr/golang-demystified"
  BookLastChangeLink = true   # lien calculé par layouts/_partials/docs/links/commit.html
  BookEditLink = true         # lien calculé par layouts/_partials/docs/links/edit.html
  BookDateFormat = "2 January 2006"
