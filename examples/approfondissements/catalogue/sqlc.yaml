# Configuration de sqlc : https://docs.sqlc.dev/en/latest/reference/config.html
version: "2"
sql:
  - engine: "postgresql"
    # sqlc lit les migrations golang-migrate (fichiers *.up.sql) pour connaître le schéma.
    schema: "internal/db/migrations"
    queries: "internal/db/requetes.sql"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        # Colonnes NULL : *int32 plutôt que pgtype.Int4.
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
        output_db_file_name: "db.gen.go"
        output_models_file_name: "modeles.gen.go"
        output_files_suffix: ".gen"
