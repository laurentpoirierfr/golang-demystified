# Configuration du livre Quarto. La liste des chapitres est ajoutée par
# tools/mkbook à l'emplacement du marqueur ci-dessous.
project:
  type: book
  output-dir: _book

lang: fr

book:
  title: "Golang Demystified"
  subtitle: "Le langage Go, ses outils et son évolution"
  author: "The Gang of Three"
  date: "2026-11-19"
  cover-image: assets/cover.png
  # chapters: généré par mkbook

number-sections: true
toc: true
toc-depth: 2

format:
  typst:
    papersize: a4
    page-numbering: false
    template-partials:
      - typst-show.typ
    margin:
      x: 2.2cm
      y: 2.5cm
    fontsize: 10.5pt
    section-numbering: 1.1.1
    code-line-numbers: false
  epub:
    toc-depth: 2
